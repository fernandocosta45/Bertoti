<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Carro</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button,
        .voltar {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        button {
            background-color: #333;
            color: white;
        }

        .voltar {
            background-color: #ddd;
            color: #333;
            margin-left: 10px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Editar Carro</h1>


    <form
            th:action="@{/carros/editar/{id}(id=${carro.id})}"
            method="post">


        <div class="campo">

            <label for="fabricante">
                Fabricante:
            </label>

            <input
                    type="text"
                    id="fabricante"
                    name="fabricante"
                    th:value="${carro.fabricante}"
                    required>

        </div>


        <div class="campo">

            <label for="modelo">
                Modelo:
            </label>

            <input
                    type="text"
                    id="modelo"
                    name="modelo"
                    th:value="${carro.modelo}"
                    required>

        </div>


        <div class="campo">

            <label for="anoFabricacao">
                Ano de Fabricação:
            </label>

            <input
                    type="number"
                    id="anoFabricacao"
                    name="anoFabricacao"
                    th:value="${carro.anoFabricacao}"
                    required>

        </div>


        <button type="submit">
            Salvar Alterações
        </button>


        <a
                href="/carros/tela"
                class="voltar">
            Voltar
        </a>

    </form>

</div>

</body>

</html>
